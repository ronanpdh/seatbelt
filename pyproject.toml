[project]
name = "seatbelt"
version = "0.0.1"
description = "Seatbelt is a model-agnostic harness for AI agents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "ronanpdh", email = "ronan@rpdh.uk" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
seatbelt = "seatbelt.cli:app"

[project.optional-dependencies]
anthropic = [
    "anthropic>=1.5.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anthropic>=1.5.0",  # adapter tests and pyright need the optional SDK
    "hypothesis>=6.168.0",
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort (import order)
  "UP",       # pyupgrade (modern syntax)
  "B",        # bugbear (likely bugs)
  "SIM",      # simplify
  "S",        # bandit security rules
  "ANN",      # require type annotations
  "RUF",      # ruff's own rules
]
ignore = ["ANN401"]   # allow Any where explicitly commented

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]   # asserts are fine in tests; annotations optional there

[tool.pyright]
include = ["src", "tests", "examples"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: needs Docker; skipped when it is absent",
]
addopts = "-ra --strict-markers"
