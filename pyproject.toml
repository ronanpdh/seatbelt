[project]
name = "seatbelt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ronanpdh", email = "ronan@rpdh.uk" }
]
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "structlog>=26.1.0",
    "typer>=0.27.2",
]

[project.scripts]
seatbelt = "seatbelt:main"

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort (import order)
  "UP",       # pyupgrade (modern syntax)
  "B",        # bugbear (likely bugs)
  "SIM",      # simplify
  "S",        # bandit security rules
  "ANN",      # require type annotations
  "RUF",      # ruff's own rules
]
ignore = ["ANN401"]   # allow Any where explicitly commented

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]   # asserts are fine in tests; annotations optional there

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
