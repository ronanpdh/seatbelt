[project]
name = "seatbelt-ai"
version = "0.5.2"
description = "Seatbelt is a model-agnostic harness for AI agents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "ronanpdh", email = "ronan@rpdh.uk" }
]
requires-python = ">=3.12"
keywords = ["ai-agents", "audit", "llm", "gateway", "tamper-evident", "ledger", "claude-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Logging",
]
# Floors: the lowest release the tests pass with, and never below the first release from which
# no later one has a known advisory. CI tests and audits them (.github/workflows/lowest.yml);
# raise one only when code needs it or the audit fails.
# Design: docs/plans/2026-09-29-dependency-floors-design.md
dependencies = [
    # the recording gateway, which `seatbelt run` also starts in-process to record locally
    "anyio>=4.14.2",
    "cryptography>=50.0.0",
    "httpx2>=2.12.0",
    "pydantic>=2.12.2",
    "pyjwt>=2.13.0",
    "pyyaml>=6.0.2",
    "rich>=13.8",
    "starlette>=1.3.1",
    "typer>=0.17",
    "uvicorn>=0.34",
]

[project.urls]
Homepage = "https://github.com/ronanpdh/seatbelt"
Source = "https://github.com/ronanpdh/seatbelt"
Changelog = "https://github.com/ronanpdh/seatbelt/blob/main/CHANGELOG.md"
Issues = "https://github.com/ronanpdh/seatbelt/issues"

[project.scripts]
seatbelt = "seatbelt.cli:app"

[project.optional-dependencies]
anthropic = [
    "anthropic>=1.0.0",
]
openai-agents = [
    "openai-agents>=0.19",
]
# kept so `seatbelt-ai[gateway]` still installs; its packages are now core dependencies
gateway = [
    "anyio>=4.14.2",
    "httpx2>=2.12.0",
    "pyjwt>=2.13.0",
    "starlette>=1.3.1",
    "uvicorn>=0.34",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# the distribution is `seatbelt-ai` (`seatbelt` on PyPI is another project); the module stays
module-name = "seatbelt"

[dependency-groups]
dev = [
    "anthropic>=1.0.0",  # adapter tests and pyright need the optional SDK
    "anyio>=4.14.2",  # gateway extra
    "httpx2>=2.12.0",
    "hypothesis>=6.168.1",
    "openai-agents>=0.19",
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "starlette>=1.3.1",
    "uvicorn>=0.34",
    "types-pyyaml>=6.0.12.20260906",
    "botocore>=1.43",  # oracle for the sink's SigV4 signing in tests; never shipped
    "botocore-stubs>=1.43.67",  # types for the test oracle
    "pyjwt>=2.13.0",
]
fuzz = [
    "atheris>=3.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort (import order)
  "UP",       # pyupgrade (modern syntax)
  "B",        # bugbear (likely bugs)
  "SIM",      # simplify
  "S",        # bandit security rules
  "ANN",      # require type annotations
  "RUF",      # ruff's own rules
]
ignore = ["ANN401"]   # allow Any where explicitly commented

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]   # asserts are fine in tests; annotations optional there

[tool.pyright]
include = ["src", "tests", "examples", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: needs Docker; skipped when it is absent",
]
addopts = "-ra --strict-markers"
