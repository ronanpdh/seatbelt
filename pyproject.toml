[project]
name = "seatbelt"
version = "0.2.0"
description = "Seatbelt is a model-agnostic harness for AI agents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "ronanpdh", email = "ronan@rpdh.uk" }
]
requires-python = ">=3.12"
dependencies = [
    # the recording gateway, which `seatbelt run` also starts in-process to record locally
    "anyio>=4.15",
    "cryptography>=50.0.1",
    "httpx2>=2.13",
    "pydantic>=2.13.5",
    "pyjwt>=2.15",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "starlette>=1.6",
    "typer>=0.27.2",
    "uvicorn>=0.53",
]

[project.scripts]
seatbelt = "seatbelt.cli:app"

[project.optional-dependencies]
anthropic = [
    "anthropic>=1.5.0",
]
openai-agents = [
    "openai-agents>=0.22.2",
]
# kept so `seatbelt[gateway]` still installs; its packages are now core dependencies
gateway = [
    "anyio>=4.15",
    "httpx2>=2.13",
    "pyjwt>=2.15",
    "starlette>=1.6",
    "uvicorn>=0.53",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anthropic>=1.5.0",  # adapter tests and pyright need the optional SDK
    "anyio>=4.15",  # gateway extra
    "httpx2>=2.13",
    "hypothesis>=6.168.0",
    "openai-agents>=0.22.2",
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "starlette>=1.6",
    "uvicorn>=0.53",
    "types-pyyaml>=6.0.12.20260906",
    "botocore>=1.43",  # oracle for the sink's SigV4 signing in tests; never shipped
    "botocore-stubs>=1.43.67",  # types for the test oracle
    "pyjwt>=2.15",
]
fuzz = [
    "atheris>=3.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort (import order)
  "UP",       # pyupgrade (modern syntax)
  "B",        # bugbear (likely bugs)
  "SIM",      # simplify
  "S",        # bandit security rules
  "ANN",      # require type annotations
  "RUF",      # ruff's own rules
]
ignore = ["ANN401"]   # allow Any where explicitly commented

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]   # asserts are fine in tests; annotations optional there

[tool.pyright]
include = ["src", "tests", "examples", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: needs Docker; skipped when it is absent",
]
addopts = "-ra --strict-markers"
