version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # the lockfile only: pyproject's floors move by hand (see its comment)
    versioning-strategy: lockfile-only
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: docker  # the base image digests in docker/Dockerfile*
    directory: /docker
    schedule:
      interval: weekly
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # uv moves by hand, with the workflows' uv and pyproject's uv_build range
      - dependency-name: astral-sh/uv
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm  # the desktop app's web view
    directory: /desktop
    schedule:
      interval: weekly
    groups:
      desktop-npm:
        patterns: ["*"]
  - package-ecosystem: cargo  # the desktop app's Rust side
    directory: /desktop/src-tauri
    schedule:
      interval: weekly
    groups:
      desktop-cargo:
        patterns: ["*"]
