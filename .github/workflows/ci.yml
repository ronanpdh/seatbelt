name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}  # sets UV_PYTHON, overriding .python-version
      - run: uv sync --locked
      - name: Gateway image requirements match uv.lock
        run: |
          uv export --locked --no-dev --extra gateway --no-emit-project -o docker/requirements-gateway.txt
          git diff --exit-code docker/requirements-gateway.txt
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -m "not integration"
  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -m integration
      - run: docker build -f docker/Dockerfile.gateway -t seatbelt-gateway .
      - run: docker run --rm --entrypoint seatbelt seatbelt-gateway gateway serve --help
  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: docker/Dockerfile
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: docker/Dockerfile.gateway
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true
          python-version: "3.12"  # Atheris ships CPython 3.12-3.14 Linux wheels
      - run: uv sync --locked --group fuzz
      - name: Fuzz the ledger reader and the stream assemblers for 60 s
        run: |
          cp -r fuzz/corpus "$RUNNER_TEMP/corpus"  # the fuzzer adds to it; keep the seeds clean
          uv run --group fuzz python fuzz/fuzz_parsers.py -max_total_time=60 "$RUNNER_TEMP/corpus"
