name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub release
      id-token: write      # Sigstore signing
      attestations: write  # provenance and SBOM attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: Tag matches package version
        run: test "${GITHUB_REF_NAME#v}" = "$(uv version --short)"
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv build
      - name: CycloneDX SBOM
        run: uv export --locked --format cyclonedx1.5 --no-dev --all-extras -o dist/sbom.cdx.json
      - name: Build provenance attestation
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4
        with:
          subject-path: dist/*.whl
          sbom-path: dist/sbom.cdx.json  # literal path; globs only work in subject-path
      - name: Provenance bundle as a release asset
        # the attestation store is where `gh attestation verify` looks; a release asset is
        # where OpenSSF Scorecard and people browsing the release look
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/seatbelt-${GITHUB_REF_NAME#v}.intoto.jsonl"
      - name: GitHub release with changelog notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          test -s notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
  image:
    needs: release  # tests passed and the release exists
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # push to ghcr.io
      id-token: write      # Sigstore signing of the image provenance
      attestations: write  # image provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Image name and version
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER}/seatbelt-gateway" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push the gateway image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.gateway
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
      - name: Image provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
